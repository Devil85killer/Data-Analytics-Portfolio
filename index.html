<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogesh Sahu | Data Analyst Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0f1d;
            --bg-card: rgba(21, 29, 56, 0.7);
            --bg-card-hover: rgba(26, 35, 66, 0.9);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #00FFFF;
            --accent-purple: #8956ff;
            --border-color: rgba(34, 43, 73, 0.8);
            --success-green: #10b981;
            --nav-bg: rgba(10, 15, 29, 0.95);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-main);
            color: var(--text-main); 
            line-height: 1.6;
            padding-top: 70px;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-sizing: border-box;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.2em;
            color: var(--text-main);
            text-decoration: none;
        }
        
        /* Hero Section */
        header { 
            padding: 80px 20px 60px; 
            text-align: center; 
            background: radial-gradient(circle at top center, #151d38 0%, var(--bg-main) 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .status-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .profile-pic-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-purple);
            box-shadow: 0 0 25px rgba(137, 86, 255, 0.4);
        }

        header h1 { 
            margin: 0 0 5px 0;
            font-size: 3.8em;
            font-weight: 900; 
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        header p.title {
            font-size: 1.2em;
            color: var(--text-muted);
            font-weight: 500;
            margin: 0 0 25px 0;
        }

        /* High-Impact Metrics */
        .hero-metrics {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .metric-pill {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text-main);
        }

        .metric-pill span {
            color: var(--accent-cyan);
        }

        /* Hero Buttons */
        .hero-btns {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }
